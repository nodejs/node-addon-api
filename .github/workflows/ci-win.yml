name: Node.js CI Windows Platform

on: [push, pull_request]

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api_version:
          - standard
          - experimental
        node-version:
          - 22.x
          - 24.x
          - 26.x
        architecture: [x64, x86]
        os:
          - windows-2022
          - windows-2025
        exclude:
          # Skip Node.js 24.x and 26.x on x86 since there are no published
          # Node.js x86 builds for those versions.
          - node-version: 24.x
            architecture: x86
          - node-version: 26.x
            architecture: x86
    runs-on: ${{ matrix.os }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        architecture: ${{ matrix.architecture }}
    - name: Check Node.js installation
      run: |
        node --version
        npm --version
    - name: Install dependencies
      run: |
        npm install
    # node-gyp@12 (from package.json) supports Visual Studio 2026, but only
    # node-gyp@13 emits the linker options that Node.js 26 builds require
    # (older node-gyp trips LNK1117 on '/opt:lldltojobs'). Upgrade in place for
    # Node.js >= 26; other versions keep node-gyp@12.
    - name: Use node-gyp@13 for Node.js >= 26
      if: matrix.node-version == '26.x'
      run: npm install --no-save node-gyp@13
    - name: npm test
      shell: bash
      run: |
        if [ "${{ matrix.api_version }}" = "experimental" ]; then
          export NAPI_VERSION=2147483647
        fi
        npm run pretest -- --verbose
        node test
